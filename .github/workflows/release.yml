name: Release

on:
  release:
    types: [published]

permissions:
  id-token: write # required for npm Trusted Publishing (OIDC)
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate and extract version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must match vX.Y.Z (got '$TAG')"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION from tag $TAG"

      # Do NOT set registry-url: setup-node would inject a placeholder
      # NODE_AUTH_TOKEN and skip OIDC Trusted Publishing (ENEEDAUTH).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Set package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set "version=$VERSION" --prefix packages/tracing
          for dir in \
            packages/langchain \
            packages/vercel-ai-sdk \
            packages/opencode-plugin \
            packages/web-record
          do
            npm pkg set "version=$VERSION" --prefix "$dir"
            # npm does not rewrite "*" / workspace: on publish — pin the dep.
            npm pkg set "dependencies.@softprobe/tracing=$VERSION" --prefix "$dir"
            echo "Set $dir -> $VERSION (depends on @softprobe/tracing@$VERSION)"
          done
          echo "Set packages/tracing -> $VERSION"

      - name: Build packages
        run: npm run build

      - name: Publish to npm (OIDC Trusted Publishing)
        run: |
          # tracing first — dependents pin @softprobe/tracing=$VERSION above
          # Do not set NODE_AUTH_TOKEN — empty/token auth blocks OIDC Trusted Publishing.
          for dir in \
            packages/tracing \
            packages/langchain \
            packages/vercel-ai-sdk \
            packages/opencode-plugin \
            packages/web-record
          do
            echo "Publishing ${dir}..."
            (cd "$dir" && npm publish --access public)
          done

      - name: Sync package versions to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -- \
            packages/tracing/package.json \
            packages/langchain/package.json \
            packages/vercel-ai-sdk/package.json \
            packages/opencode-plugin/package.json \
            packages/web-record/package.json

          git fetch origin main
          git checkout -B main origin/main

          for dir in \
            packages/tracing \
            packages/langchain \
            packages/vercel-ai-sdk \
            packages/opencode-plugin \
            packages/web-record
          do
            npm pkg set "version=$VERSION" --prefix "$dir"
          done
          for dir in \
            packages/langchain \
            packages/vercel-ai-sdk \
            packages/opencode-plugin \
            packages/web-record
          do
            npm pkg set "dependencies.@softprobe/tracing=*" --prefix "$dir"
          done

          if git diff --quiet -- \
            packages/tracing/package.json \
            packages/langchain/package.json \
            packages/vercel-ai-sdk/package.json \
            packages/opencode-plugin/package.json \
            packages/web-record/package.json
          then
            echo "main already at version $VERSION"
            exit 0
          fi

          git add \
            packages/tracing/package.json \
            packages/langchain/package.json \
            packages/vercel-ai-sdk/package.json \
            packages/opencode-plugin/package.json \
            packages/web-record/package.json
          git commit -m "chore: sync package versions to ${VERSION}"
          git push origin main
