name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/e2e-sdk, feat/application-session-capture-sdk]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: E2E_TELEMETRY_DISABLED=1 npm test
